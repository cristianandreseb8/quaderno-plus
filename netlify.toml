[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Shared links get the recipe's title and photo in the page (link previews): netlify/functions/share.mjs
[[redirects]]
  from = "/"
  to = "/.netlify/functions/share?r=:r"
  status = 200
  force = true
  query = { r = ":r" }

[[redirects]]
  from = "/"
  to = "/.netlify/functions/share?invite=:invite"
  status = 200
  force = true
  query = { invite = ":invite" }

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
